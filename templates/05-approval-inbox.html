  const trace=isTodo
    ? [['提交申请',t.by+'（'+t.byDept+'）',t.at,'done'],['部门经理审批','已同意 · 采购主管','2026-09-17 09:10','done'],[t.node,'待你处理','当前节点','now'],['财务预算校验','等待前序节点','—',''],['转采购订单','等待前序节点','—','']]
    : [['提交申请',t.by+'（'+t.byDept+'）',t.at,'done'],[t.node.split('（')[0]||'审批',t.at2+' · 陈曦','','done'],['单据状态：'+(t.result==='reject'?'已驳回':'已通过'),t.result==='reject'?'已退回申请人修改':'已进入下一环节',t.at2,'done']];
  document.getElementById('detail').innerHTML=`
    <div class="detail-h">
      <div>
        <div class="dt-t">${t.title}</div>
        <div class="meta">
          <span class="tag t-br">${t.type}</span>
          <span class="num">${t.code}</span><span>·</span>
          <span>提交人 ${t.by}（${t.byDept}）</span><span>·</span>
          <span class="num">${t.at}</span>
          ${isTodo&&t.urgent?'<span class="tag t-warn"><i></i>加急</span>':''}
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12.5px;color:var(--text-3);margin-bottom:4px">申请金额</div>
        <div style="font-size:22px;font-weight:600" class="num">${money(t.amt)}</div>
      </div>
    </div>
    <div class="detail-b">
      <div>
        ${isTodo?`<div class="rem ${t.leftH<0?'crit':''}">
          ${t.leftH<0?`该单据已超期 ${Math.abs(t.leftH)} 小时，请尽快处理（超期将计入部门审批时效考核）。`
                    :t.leftH<=8?`该单据剩余处理时限仅 ${t.leftH} 小时，请优先处理。`
                    :`处理时限剩余 ${t.leftH} 小时，请在时限内完成审批。`}
        </div>`:''}
        <div class="sec-t">单据摘要</div>
        <dl class="kv">
          <dt>单据编号</dt><dd class="num">${t.code}</dd>
          <dt>单据类型</dt><dd>${t.type}</dd>
          <dt>申请部门</dt><dd>${t.byDept}</dd>
          <dt>申请人</dt><dd>${t.by}</dd>
          <dt>当前节点</dt><dd>${t.node}</dd>
          <dt>提交时间</dt><dd class="num">${t.at}</dd>
          <dt>用途说明</dt><dd style="grid-column:span 3">${t.memo||'—'}</dd>
        </dl>
        <div class="sec-t">明细信息</div>
        <div class="tbl-wrap">
          <table>
            <thead><tr><th>物料编码</th><th>物料名称 / 项目</th><th class="r">数量</th><th class="c">单位</th><th class="r">单价</th><th class="r">金额</th></tr></thead>
            <tbody>${t.lines.map(l=>`<tr><td class="num">${l[0]}</td><td>${l[1]}</td><td class="r num">${l[2]}</td><td class="c">${l[3]}</td><td class="r num">${money(l[4])}</td><td class="r num">${money(l[5])}</td></tr>`).join('')}</tbody>
            <tfoot><tr><td colspan="5" class="r">合计</td><td class="r num">${money(sum)}</td></tr></tfoot>
          </table>
        </div>
      </div>
      <div>
        <div class="sec-t">审批轨迹</div>
        <div class="tl">${trace.map(tr=>`<div class="tl-i ${tr[3]}">
          <div class="t">${tr[0]}</div><div class="d">${tr[1]}</div><div class="n num">${tr[2]}</div></div>`).join('')}</div>
        ${isTodo?`<div style="margin-top:18px;font-size:12.5px;color:var(--text-3);line-height:1.8">
          审批留痕要求：本节点所有操作将记录操作人与时间，驳回必须填写原因，生成类能力不得自动提交。</div>`:''}
      </div>
    </div>
    ${isTodo?`<div class="actbar">
      <button class="btn" onclick="transfer()">转办</button>
      <button class="btn btn-dg" onclick="reject()">驳回</button>
      <button class="btn btn-p" onclick="agree()">同意并提交下一节点</button>
    </div>`:`<div class="actbar"><button class="btn" onclick="toast('已复制单据链接（演示）')">复制链接</button></div>`}`;
}
function act(kind){
  const t=TODO.find(x=>x.id===cur); if(!t) return;
  if(kind==='reject'){
    const why=prompt('请输入驳回原因（必填，将同步通知申请人）：','');
    if(!why) return toast('驳回已取消：必须填写驳回原因');
    TODO.splice(TODO.indexOf(t),1);
    DONE.unshift({...t,node:'已办结（驳回）',result:'reject',at2:'2026-09-17 16:20',reason:why});
    toast('已驳回并通知申请人：'+t.by);
  } else if(kind==='transfer'){
    const who=prompt('转办给（输入审批人姓名）：','王磊');
    if(!who) return toast('转办已取消');
    TODO.splice(TODO.indexOf(t),1);
    toast(`已将 ${t.code} 转办给 ${who}，并同步通知`);
  } else {
    if(!confirm(`确认同意「${t.title}」？\n金额 ${money(t.amt)}，同意后将流转至下一审批节点。`)) return;
    TODO.splice(TODO.indexOf(t),1);
    DONE.unshift({...t,node:'已办结（同意）',result:'agree',at2:'2026-09-17 16:20'});
    toast('已同意，单据已流转至下一节点：财务预算校验');
  }
  const next=TODO[0];
  if(next){ select(next.id); } else { cur=null; renderList(); document.getElementById('detail').innerHTML='<div class="empty"><div style="font-size:26px;margin-bottom:8px">✓</div>待办已清空，暂无需要你处理的单据</div>'; }
}
function agree(){ act('agree'); } function reject(){ act('reject'); } function transfer(){ act('transfer'); }
let tid; function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tid); tid=setTimeout(()=>t.classList.remove('on'),2400); }
renderList(); select('T1');
</script>
</body>
</html>
