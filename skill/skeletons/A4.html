<!-- ================= A4 · 运营看板页（骨架） =================
     区块顺序固定：页面头（含时间范围）→ KPI 卡行 → 中区图表（趋势 + 构成）→ 下区预警清单
     铁律：图表手写 SVG，不引图表库；KPI 带环比且涨红跌绿；切换时间范围数值与图形同步变化；
          每张图标注单位与口径；缺数据给「暂无数据」占位。
-->
<div class="page-head">
  <div>
    <h1>{{PAGE_NAME}}</h1>
    <div class="sub" id="pageSub">{{PAGE_SUB}}</div>
  </div>
  <div class="head-actions">
    <select id="range" style="width:110px" aria-label="时间范围">{{RANGE_OPTIONS}}</select>
    {{HEAD_ACTIONS}}
  </div>
</div>

<div class="kpis" id="kpis"></div>

<div class="grid-wide" style="margin-top:14px">
  <div class="card" style="margin-top:0">
    <div class="card-h">{{TREND_TITLE}}<span class="right muted" id="trendUnit"></span></div>
    <div class="card-b chart-wrap" id="trend"></div>
  </div>
  <div class="card" style="margin-top:0">
    <div class="card-h">{{SHARE_TITLE}}<span class="right muted">单位：%</span></div>
    <div class="card-b" id="share"></div>
  </div>
</div>

<div class="card" style="margin-top:14px">
  <div class="card-h">{{WARN_TITLE}}<span class="right"><span class="muted" id="warnCount"></span></span></div>
  <div class="tbl-wrap">
    <table id="warnTable">
      <thead><tr>{{WARN_HEAD}}</tr></thead>
      <tbody id="warnBody"></tbody>
    </table>
  </div>
</div>
<p class="muted caliber">{{CALIBER}}</p>

<script>
(function () {
  var M = window.__MODEL__;
  var sel = F.$('#range');

  function deltaHtml(k, d) {
    // 涨红跌绿是中国习惯；但「越低越好」的指标（如呆滞金额）涨了是坏事，语义色以 goodWhen 为准
    var dir = d > 0 ? 'up' : (d < 0 ? 'down' : 'flat');
    var arrow = d > 0 ? '▲' : (d < 0 ? '▼' : '—');
    return '<span class="d ' + dir + '">环比 ' + arrow + ' ' + F.pct(Math.abs(d), 1) + '</span>';
  }

  function fmtV(k, v) {
    if (k.type === 'money') { return F.money(v); }
    if (k.type === 'percent') { return F.pct(v, 1); }
    return F.num(v, k.precision || 0) + (k.unit ? ' <span class="muted">' + k.unit + '</span>' : '');
  }

  function renderKpis(D) {
    F.$('#kpis').innerHTML = D.kpis.map(function (k, i) {
      return '<div class="kpi" data-kpi="' + i + '"><div class="t">' + k.name + '</div>' +
        '<div class="v">' + fmtV(k, k.value) + '</div>' + deltaHtml(k, k.delta) +
        '<div class="bar" style="background:' + k.color + '"></div></div>';
    }).join('');
    F.$$('[data-kpi]').forEach(function (c) {
      c.onclick = function () { F.toast('下钻：' + D.kpis[+c.getAttribute('data-kpi')].name + '明细（演示）'); };
    });
  }

  function renderTrend(D) {
    var host = F.$('#trend');
    var pts = D.trend;
    if (!pts || !pts.length) { host.innerHTML = '<div class="holder">暂无数据</div>'; return; }
    var W = 640, H = 230, L = 52, B = 28, T = 14, Rr = 10;
    var max = Math.max.apply(null, pts.map(function (p) { return p.v; })) * 1.15;
    var step = (W - L - Rr) / (pts.length - 1);
    var y = function (v) { return T + (H - T - B) * (1 - v / max); };
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + (L + i * step).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    var area = line + ' L' + (L + (pts.length - 1) * step).toFixed(1) + ' ' + (H - B) + ' L' + L + ' ' + (H - B) + ' Z';
    var grid = '';
    for (var g = 0; g <= 4; g++) {
      var gv = max * g / 4, gy = y(gv).toFixed(1);
      grid += '<line x1="' + L + '" x2="' + (W - Rr) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)"/>' +
        '<text x="' + (L - 8) + '" y="' + gy + '" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--text-3)">' + F.num(gv, 0) + '</text>';
    }
    var xs = pts.map(function (p, i) {
      return '<text x="' + (L + i * step).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--text-3)">' + p.x + '</text>' +
        '<circle cx="' + (L + i * step).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="3" fill="var(--card)" stroke="var(--brand)" stroke-width="2"><title>' + p.x + '：' + F.num(p.v, 0) + '</title></circle>';
    }).join('');
    host.innerHTML = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="趋势图">' + grid +
      '<path d="' + area + '" fill="var(--brand-soft)"/><path d="' + line + '" fill="none" stroke="var(--brand)" stroke-width="2"/>' + xs + '</svg>';
    F.$('#trendUnit').textContent = '单位：' + M.trendUnit + ' · ' + pts.length + ' 个点';
  }

  function renderShare(D) {
    var host = F.$('#share');
    if (!D.share || !D.share.length) { host.innerHTML = '<div class="holder">暂无数据</div>'; return; }
    var total = D.share.reduce(function (s, x) { return s + x.v; }, 0) || 1;
    host.innerHTML = D.share.map(function (x) {
      var p = x.v / total * 100;
      return '<div class="bar-row"><span>' + x.name + '</span><div class="track"><div class="fill" style="width:' + p.toFixed(1) +
        '%;background:' + x.color + '"></div></div><span class="val">' + F.pct(p, 1) + '</span></div>';
    }).join('');
  }

  function renderWarn(D) {
    var rows = D.warn;
    F.$('#warnCount').textContent = '共 ' + rows.length + ' 条';
    F.$('#warnBody').innerHTML = rows.length ? rows.map(function (r) {
      return '<tr>' + F.cells(r, M.warnColumns) + '<td class="c"><button class="btn btn-sm" data-handle="1">处理</button></td></tr>';
    }).join('') : '<tr><td colspan="' + (M.warnColumns.length + 1) + '"><div class="holder">暂无数据</div></td></tr>';
    F.$$('[data-handle]').forEach(function (b) { b.onclick = function () { F.toast('已生成处理任务（演示）'); }; });
  }

  function render() {
    var D = M.ranges[sel.value];
    renderKpis(D); renderTrend(D); renderShare(D); renderWarn(D);
    F.$('#pageSub').innerHTML = '统计范围：<b>' + sel.value + '</b>（' + D.period + '）· 数据截止 ' + M.asOf + ' · 环比口径为上一同长度周期';
  }

  sel.onchange = render;
  render();
})();
</script>
